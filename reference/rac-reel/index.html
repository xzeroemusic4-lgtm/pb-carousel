      // ---------------------------------------------------------------------------

      // Camera = keyframed position + look-at. Chips are pinned by projecting points.

      // Beats are authored on a 90.2 s clock. WARP maps film time to that clock at each spoken line.
      const FILM = 101.1;
      const WARP = [[0, 0.0], [2.89, 2.523], [5.9, 5.358], [7.38, 6.635], [8.85, 8.22], [14.22, 12.929], [16.4, 14.381], [18.71, 16.628], [21.31, 18.884], [23.35, 20.865], [24.53, 22.378], [26.96, 24.191], [29.93, 26.51], [33.75, 29.662], [35.49, 31.131], [37.73, 33.295], [42.17, 36.955], [46.16, 41.123], [48.73, 43.055], [55.17, 48.76], [63.13, 56.339], [65.49, 58.343], [72.09, 63.677], [74.19, 65.637], [75.26, 66.691], [78.38, 69.555], [82.19, 72.665], [83.77, 74.382], [85.82, 75.885], [88.59, 78.337], [90.84, 80.585], [94.46, 83.771], [95.8, 85.007], [101.1, 90.2]];
      const warp = (t) => {
        const i = WARP.findIndex((k) => k[0] > t);
        if (i < 0) return WARP[WARP.length - 1][1];
        const [a, b] = [WARP[i - 1], WARP[i]];

      const DUR = 90.2, W = 1080, H = 1920, FOV = 38, BLOOM = 1;

      const ease = (n) => easeCache[n] || (easeCache[n] = gsap.parseEase(n));
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      function track(keys) {
        const es = keys.map((k) => ease(k[2] || "none"));
        return (t) => {
          if (t <= keys[0][0]) return keys[0][1];
          for (let i = 1; i < keys.length; i++) {
            if (t <= keys[i][0]) {
              const [t0, v0] = keys[i - 1];
              const [t1, v1] = keys[i];
              return v0 + (v1 - v0) * es[i]((t - t0) / (t1 - t0));
            }
          }
          return keys[keys.length - 1][1];
        };
      }
      function seg(t, t0, t1, v0, v1, e = "none") {
        if (t <= t0) return v0;
        if (t >= t1) return v1;
        return v0 + (v1 - v0) * ease(e)((t - t0) / (t1 - t0));
      }
      const hash = (i, k = 1) => {

      const C = (h) => new THREE.Color(h);
      const V = (x, y, z) => new THREE.Vector3(x, y, z);
      const COL = {

      function colorTrack(keys, dur = 0.22) {
        return (t, out) => {
          let i = 0;
          while (i + 1 < keys.length && t >= keys[i + 1][0]) i++;
          out.copy(COL[keys[i][1]]);
          if (i > 0) out.copy(COL[keys[i - 1][1]]).lerp(COL[keys[i][1]], clamp((t - keys[i][0]) / dur, 0, 1));
          return out;
        };
      }

      // Camera poses
      const P = {
        h0: [[0.42, 3.05, 3.5], [-1.22, 0.78, -0.25]], h1: [[0.34, 2.9, 3.2], [-1.22, 0.78, -0.25]],
        h2: [[0.2, 2.75, 3.0], [-1.22, 0.78, -0.25]], top0: [[0.05, 17, 3.3], [0, 0, -0.35]], top1: [[0.3, 15.6, 3], [0, 0, -0.35]],
        b0: [[0.62, 2.35, 2.5], [-1.3, 0.34, -0.1]], b1: [[0.5, 2.15, 2.2], [-1.3, 0.34, -0.1]],
        p0: [[6.1, 2.65, 10], [-0.5, 2.3, -9]], p1: [[5.6, 2.75, 8.4], [-0.5, 2.3, -9]],
        q0: [[1.9, 4.8, 5.4], [-0.85, 0.28, -1.3]], q1: [[1.75, 4.55, 5.0], [-0.85, 0.28, -1.3]], q2: [[1.5, 4.2, 4.5], [-0.95, 0.6, -1.0]],
        u0: [[0.46, 2.8, 3.1], [-1.25, 0.8, -0.1]], u1: [[0.3, 2.3, 2.45], [-1.28, 0.8, 0.2]], u2: [[0.2, 2.1, 2.2], [-1.28, 0.8, 0.2]],
        a0: [[STAGE_A + 0.2, 3.1, 13.2], [STAGE_A, 1.0, 0]], a1: [[STAGE_A - 0.2, 2.9, 12.4], [STAGE_A, 1.0, 0]],
        a2: [[STAGE_A + 3.5, 8, 14.5], [STAGE_A, 1.9, 0]], a3: [[STAGE_A + 4.6, 7.5, 13.2], [STAGE_A, 1.9, 0]],
        s0: [[STAGE_B - 0.5, 2.6, 13.4], [STAGE_B, 2.2, 0]], s1: [[STAGE_B + 0.5, 2.5, 12.8], [STAGE_B, 2.2, 0]],

        [8.42, P.top0, "power3.inOut"], [16.19, P.top1, "sine.inOut"], [16.72, P.b0, "power3.inOut"], [18.72, P.b1, "sine.inOut"],
        [19.5, P.p0, "power3.inOut"], [22.17, P.p1, "sine.out"], [22.1701, P.q0], [26.4, P.q1, "sine.inOut"], [29.2, P.q2, "power1.inOut"],
        [33.09, P.q2, "sine.inOut"], [33.0901, P.u0], [36.88, P.u0, "sine.inOut"], [37.6, P.u1, "power2.inOut"], [40.91, P.u2, "sine.inOut"],
        [40.9101, P.a0], [48.3, P.a1, "sine.inOut"], [48.9, P.a2, "power3.inOut"], [56.13, P.a3, "sine.inOut"],

        [80.3701, P.h3], [DUR, P.h4, "sine.out"],
      ];
      const camP = [0, 1, 2].map((i) => track(CAM.map((k) => [k[0], k[1][0][i], k[2]])));
      const camL = [0, 1, 2].map((i) => track(CAM.map((k) => [k[0], k[1][1][i], k[2]])));
      const DIPS = [22.17, 33.09, 40.91, 56.13, 65.43, 80.37];
      const dip = (t) => DIPS.reduce((m, c) => Math.max(m, Math.abs(t - c) < 0.23 ? Math.sin((Math.PI * (t - c + 0.23)) / 0.46) : 0), 0);

      // Renderer + selective bloom
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(2 / 3);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.localClippingEnabled = true;

      const scene = new THREE.Scene();
      const bgColor = new THREE.Color(BG);
      scene.background = bgColor;
      scene.fog = new THREE.Fog(BG, 26, 72);
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.32;
      const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 240);
      camera.layers.enable(BLOOM);
      scene.add(camera);
      const lookAt = new THREE.Vector3();
      scene.add(new THREE.HemisphereLight(0xa8c8ff, 0x0a1f3a, 1.2));
      const key = new THREE.DirectionalLight(0xffffff, 1.6);

      const renderScene = new RenderPass(scene, camera);
      const bloomComposer = new EffectComposer(renderer);
      bloomComposer.renderToScreen = false;
      bloomComposer.addPass(renderScene);

      const mixPass = new ShaderPass(
        new THREE.ShaderMaterial({
          uniforms: { baseTexture: { value: null }, bloomTexture: { value: bloomComposer.renderTarget2.texture } },
          vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
          fragmentShader:
            "uniform sampler2D baseTexture; uniform sampler2D bloomTexture; varying vec2 vUv; void main(){ gl_FragColor = texture2D(baseTexture, vUv) + texture2D(bloomTexture, vUv); }",

      const glowAll = (obj) => obj.traverse((o) => o.layers.enable(BLOOM));
      const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000, fog: false });
      const bloomLayer = new THREE.Layers();
      bloomLayer.set(BLOOM);
      const saved = new Map();
      function darken(o) {

      const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.05, ...o });
      const glowMat = (color) => new THREE.MeshBasicMaterial({ color, transparent: true, depthWrite: false });
      const add = (parent, geo, mat, x = 0, y = 0, z = 0) => {

      function canvasTex(w, h, draw) {

      const TILES = [];
      const hero = {};
      function wallTexture(emissive) {

          for (let i = 0; i < NB; i++) {
            const a = i * 400 + 85, b = 96;

      const halfA = colorTrack([[-1, "yel"], [5.9, "red"], [7.15, "yel"], [8.1, "pale"], [13.77, "red"], [22.17, "pale"], [30.48, "grn"], [33.09, "yel"], [80.37, "yel"]]);
